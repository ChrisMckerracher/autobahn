# Builds the app for people to try, on a push to main that touches it.
# Eight minutes across three runners in parallel, so it finishes inside
# the time CI takes anyway and never delays anything. Runner time is
# free on a public repository, so there is nothing to save by asking
# for it, and a channel that always matches main cannot go stale
# without anybody noticing — which is what the branch it used to watch
# did.
#
# Separate from release.yml, which ships the command on a tag and signs
# and notarises everything. Nothing here is signed: these are builds to
# hand to a tester, and the macOS one needs the quarantine bit cleared
# before it will open. The release workflow is where signing belongs,
# and this will fold into it when the app is ready to ship.
#
# Three platforms, each built natively rather than cross-compiled: GPUI
# links against the system's graphics and font libraries, and a sysroot
# good enough to cross-compile that is more work than a second runner.
# aarch64 Linux runners are free on public repositories.
#
# The result is one prerelease, `app-latest`, moved to each new build —
# so there is always one link to send somebody, and it is always the
# newest. A prerelease because it is exactly that, and because it keeps
# these builds out of the way of the real releases.
name: App

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'apps/app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch. Without this, two pushes in the eight
# minutes a build takes leave two `publish` jobs racing to delete and
# recreate the same release — which is not one operation, so the loser
# can leave `app-latest` short a platform or without its tag.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The kit needs a newer compiler than the repository's own pin.
  TOOLCHAIN: '1.98.0'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # One platform failing should not hide whether the others work,
      # which is the whole question the first time this runs.
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runs-on: macos-15
          - platform: linux-x86_64
            runs-on: ubuntu-24.04
          - platform: linux-aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: |
          # minimal omits clippy, and the lint step below needs it.
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy
          rustup default "$TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.platform }}

      # Two stacks, not one. GPUI wants Vulkan to draw with, xkbcommon and
      # wayland for the window, fontconfig for the text. The menu bar item
      # and the notifications are muda, tray-icon and notify-rust, which on
      # Linux are GTK3 and D-Bus — libgtk-3-dev is what brings glib, gdk,
      # pango, cairo and atk with it.
      #
      # A tester still needs a Vulkan driver and a display server at run
      # time. That is not this list.
      - name: Libraries the app links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config \
            cmake \
            clang

      # Lints here rather than in ci.yml: the app's half of the tree is
      # gpui-kit, which ordinary CI never compiles, so linting it there
      # would make every push pay for a dependency only this workflow
      # builds. One platform is enough — the lint is the same on all
      # three, and the other two would only repeat it.
      - name: Lints
        if: matrix.platform == 'linux-x86_64'
        run: cargo clippy --release --locked --all-targets --features app -- -D warnings

      - name: Build
        run: cargo build --release --locked --features app --bin autobahn-app

      - name: Bundle the app
        if: runner.os == 'macOS'
        run: |
          APP="Autobahn.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/autobahn-app "$APP/Contents/MacOS/autobahn-app"
          if xcrun actool assets/Autobahn.icon --compile "$APP/Contents/Resources" \
               --app-icon Autobahn --platform macosx --minimum-deployment-target 11.0 \
               --output-partial-info-plist "$(mktemp)" >/dev/null 2>&1; then
              ICON=Autobahn
          else
              cp assets/autobahn.icns "$APP/Contents/Resources/autobahn.icns"
              ICON=autobahn
          fi
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Autobahn</string>
            <key>CFBundleDisplayName</key><string>Autobahn</string>
            <key>CFBundleIdentifier</key><string>vip.faraz.autobahn.app</string>
            <key>CFBundleExecutable</key><string>autobahn-app</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleIconFile</key><string>$ICON</string>
            <key>CFBundleIconName</key><string>$ICON</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # ditto rather than zip, so the bundle's structure survives.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "autobahn-app-${{ matrix.platform }}.zip"

      - name: Stage the Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage
          cp target/release/autobahn-app stage/
          tar -C stage -czf "autobahn-app-${{ matrix.platform }}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: autobahn-app-${{ matrix.platform }}
          path: autobahn-app-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish app-latest
    needs: build
    # A platform that failed should not stop the ones that worked from
    # reaching the person waiting to try them.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: downloaded
          merge-multiple: true

      - name: What was built
        run: ls -la downloaded

      - name: Move app-latest to this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd downloaded
          sha256sum * > SHA256SUMS
          # The notes are written outside `downloaded/`, because the upload
          # below is `./*` and they are the release's body, not a download.
          {
            echo "Unsigned builds of the app, from \`${GITHUB_SHA:0:7}\` on \`$GITHUB_REF_NAME\`."
            echo "Built $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "**macOS** — unzip, then clear the quarantine bit before it will open:"
            echo
            echo '    xattr -dr com.apple.quarantine "Autobahn.app"'
            echo
            echo "**Linux** — untar and run \`./autobahn-app\`. Needs a Vulkan driver,"
            echo "either Wayland or X11, and the shared libraries the build links against:"
            echo
            echo "    sudo apt install libgtk-3-0 libayatana-appindicator3-1 libxdo3 libvulkan1"
            echo
            echo "The \`autobahn\` command is a separate download and is not in here. The"
            echo "app offers to install it on first run if it cannot find one."
          } > "$RUNNER_TEMP/notes.md"
          # Deleting and recreating, rather than editing, so the asset list
          # never mixes this build's files with the last one's.
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest ./* \
            --title "Dash (latest build)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease \
            --target "$GITHUB_SHA"
