# The documentation site, built by MkDocs and served from GitHub Pages at
# https://fny.github.io/autobahn.
#
# Two reasons this is its own workflow rather than a job in ci.yml. ci.yml
# ignores `docs/**` and `**.md` on purpose, because prose cannot affect a
# build — so the one workflow that must run on a docs change is this one. And
# Pages deployment needs `pages: write` and `id-token: write`, which ci.yml
# deliberately does not have: it is `contents: read` and nothing else.
#
# On a pull request it builds and does not deploy. That matters more than it
# sounds: mkdocs.yml sets `strict: true`, so a link to a page that does not
# exist, or to a heading anchor that does not exist, fails the build. The docs
# cross-reference each other 162 times, and this is what keeps that honest.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: MkDocs and the theme, at the pinned versions
        run: pip install -r docs/requirements.txt
      # strict: true lives in mkdocs.yml, so this fails on a dead link or a
      # dead anchor whether it is run here or by hand.
      - name: Build the site
        run: mkdocs build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one in flight — a half-applied
    # Pages deployment is a site serving a mix of two builds.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
