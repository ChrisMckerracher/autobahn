# What the dependencies carry, from the RustSec database and their own
# manifests: `cargo deny check advisories licenses`, both configured by
# deny.toml. Weekly, on any change to Cargo.lock or deny.toml, and by
# hand:
#   gh workflow run audit.yml
# Not part of the per-push CI, so an advisory published today doesn't
# block unrelated work; the weekly run is what reports it.
#
# The two fail for different reasons. An advisory appears without
# anything here changing, which is why this is not a push gate. A
# licence changes only when a dependency does, so that half is a gate
# on Cargo.lock: what ships under Autobahn's own licence should never
# move without somebody saying so.
name: Audit

on:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older check of the same branch: the question
# is what the lock file says now, and an answer about what it said two
# commits ago is not worth a runner. The scheduled run has its own ref,
# so a weekly check is never cancelled by a push.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  # cargo-deny's release binary, checked against its SHA-256 before it runs.
  # To upgrade, change both, from the release's .sha256 asset.
  CARGO_DENY_VERSION: '0.20.2'
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$name/cargo-deny" ~/.cargo/bin/cargo-deny
      - name: Advisories
        run: cargo deny --locked check advisories
      # Separate step, so the log says which of the two failed without
      # anybody opening it.
      - name: Licences
        run: cargo deny --locked check licenses
