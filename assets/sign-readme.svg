<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 2.5 19 17" width="19" height="17">
  <!-- The Autobahn sign, cropped to the art for setting beside text.
       assets/sign.svg carries the same geometry in a square box with the
       margin the icon needs; here the box is the mark's own bounds, so an
       inline image sits on the baseline and `height` is the cap height. -->
  <g fill="#000">
    <polygon points="5.474,11.600 9.022,11.600 10.200,2.500 8.900,2.500"/>
    <polygon points="2.500,19.500 8.000,19.500 8.880,12.700 5.060,12.700"/>
    <polygon points="12.978,11.600 16.526,11.600 13.100,2.500 11.800,2.500"/>
    <polygon points="14.000,19.500 19.500,19.500 16.940,12.700 13.120,12.700"/>
    <rect x="1.5" y="9.4" width="19" height="2.2"/>
  </g>
</svg>
