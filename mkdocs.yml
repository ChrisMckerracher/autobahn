# The documentation site, at https://fny.github.io/autobahn.
#
# The docs are read on GitHub first and the site is the second view, so the
# source keeps plain relative links like `./ignores.md` and `../p2p.md#anchor`.
# MkDocs rewrites those to page URLs when it builds, which is the reason it is
# MkDocs and not a generator that wants its own link syntax: 162 links and 26
# anchors keep working in both places with no edits.
#
# Build it the way CI does:
#   pip install -r docs/requirements.txt
#   mkdocs serve      # http://127.0.0.1:8000
#   mkdocs build      # into site/
site_name: Autobahn
site_description: Subsecond sync with German precision.
site_url: https://fny.github.io/autobahn/
repo_url: https://github.com/fny/autobahn
repo_name: fny/autobahn
edit_uri: edit/main/docs/
copyright: AGPL-3.0-or-later OR LicenseRef-Donor

# Pinned in docs/requirements.txt. The theme is 0.x and essentially one
# maintainer, so it moves on our schedule rather than its own. Nothing in the
# pages depends on it — `name: material` is the whole fallback if it stops
# being maintained.
theme:
  name: shadcn

# scripts/mkdocs_hooks.py: a link that leaves docs/ is rewritten to point at
# the file on GitHub, so the source can keep the plain relative form that is
# correct when the same page is read on GitHub.
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  # GitHub alert blocks (`> [!NOTE]`) are GitHub's syntax, not MkDocs'. Without
  # this they render as plain blockquotes; with it they become admonitions.
  - callouts

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's slug rule, not Python-Markdown's. They disagree wherever a
      # heading holds punctuation — GitHub turns `&` into a double dash and
      # drops backticks — and our headings are full of both, so the default
      # would quietly break the anchors that already work on GitHub.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

# A link that points at a page or anchor which does not exist is a broken
# promise in a document whose whole job is cross-referencing.
# `strict` makes every warning below fatal. The build is clean today, and the
# whole point of a document that cross-references 24 others is that the
# references are right — a dead link should stop the site, not ship with it.
# (These three take warn/info/ignore, not error; `strict` is what promotes
# them.)
strict: true
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Setting up:
      - Configuration: configuration.md
      - Commands: commands.md
      - Modes: modes.md
      - Ignores: ignores.md
  - Running it:
      - Autobahn Dash: app.md
      - The menu bar item: tray.md
      - TUI: shop.md
      - Alerts: alerts.md
      - Logging: logging.md
      - State: state.md
  - Files and conflicts:
      - Conflict resolution: conflicts.md
      - Git checkouts: git.md
  - How it works:
      - Architecture: how-it-works.md
      - Safety: safety.md
      - Invariants: correctness/invariants.md
      - Accepted risks: correctness/accepted-risks.md
      - Scope and support: limitations.md
  - Performance:
      - Autobahn vs mutagen: benchmarks.md
      - Benchmark matrix: benchmark-matrix.md
  - Experimental:
      - Multi-host failover P2P: p2p.md
  - Project:
      - Development: development.md
      - Releases: releases.md
      - Donations: donations.md
      - Roadmap: wishlist.md
